<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平行视角 · Herdthink</title><link rel="stylesheet" href="./style.css"></head><body>
<header><div class="bar"><a href="./" class="brand"><i class="brand-icon"></i>Herdthink</a><nav aria-label="主导航"><button id="exploreNav" aria-current="page">视角探索</button><button id="archiveNav">观察档案 <span id="count">0</span></button></nav><a class="chatlink" href="../">基础问答 ↗</a></div></header>
<main><section id="explore"><div class="intro"><div><div class="eyebrow"><b></b> 平行视角 / 议题探索</div><h1 id="title"></h1><p id="subtitle"></p></div><label class="picker">切换议题<select id="topic" aria-label="切换议题"></select></label></div>
<div class="work"><section class="map"><div class="map-head"><span class="overline">PERSPECTIVE ATLAS</span><h2>视角星图</h2></div><div class="map-tools"><button id="reset" title="复位星图" aria-label="复位星图">⟲</button></div><div id="space"><canvas id="sky" aria-hidden="true"></canvas><div id="nodes"></div></div><div class="map-foot"><span>拖动旋转 · 点击节点查看</span><span id="mapMeta">3 个视角</span></div></section>
<section class="reader"><div class="eyebrow"><b></b> 当前视角</div><h2 id="role"></h2><p id="desc"></p><div id="focuses" class="chips" aria-label="选择关注点"></div><div class="reading"><div class="overline">关注问题</div><h3 id="question"></h3><div class="overline">视角解读</div><p id="interpret"></p></div><button id="save" class="primary"></button></section></div>
<section class="evidence"><div class="section-head"><div><div class="eyebrow"><b></b> 来源与解读</div><h2>同一份材料，不同的读法</h2></div><span class="muted">知乎检索快照 · 策展示例</span></div><div class="evidence-grid"><article class="source"><div class="overline">知乎原始材料</div><h3 id="sourceTitle"></h3><div id="author" class="muted"></div><p id="summary"></p><a id="original" class="action" target="_blank" rel="noopener noreferrer">阅读知乎原文 ↗</a></article><div class="compare"><div class="compare-head"><b>同源对照</b><label>对比视角 <select id="versus"></select></label></div><div id="pair"></div></div></div></section></section>
<section id="archive" hidden><div class="intro"><div><div class="eyebrow"><b></b> 个人观察</div><h1>我的观察档案</h1><p>回看你收藏的关注点，写下影响选择的条件。</p></div><button id="back" class="action">返回探索 ↗</button></div><section class="map archive-map" id="archiveMap"><div class="map-head"><div class="overline">OBSERVATION ATLAS</div><h2>个人视角图</h2></div><label class="map-tools"><select id="archiveTopic" aria-label="档案议题"></select></label><div class="space" id="archiveSpace"><canvas id="archiveSky" aria-hidden="true"></canvas><div id="archiveNodes"></div></div><div class="map-foot"><span>点击视角筛选记录 · 拖动旋转</span><button id="clearLens">显示该议题全部</button></div></section><div id="records"></div></section>
<footer><b>Herdthink</b><span>平行视角 · 知乎知识探索原型</span></footer></main>
<script type="module" src="./app.js"></script></body></html>
