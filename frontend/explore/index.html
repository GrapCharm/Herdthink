<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b16"><title>平行视角 · Herdthink</title><link rel="stylesheet" href="./style.css"></head>
<body><header><a href="./" class="brand"><i></i>Herdthink<span>平行视角</span></a><button id="restart" hidden>重新提问 ↗</button></header>
<main><div id="space"><canvas aria-hidden="true"></canvas><div id="labels"></div></div>
<section id="intro"><h1>同一个问题，<br>在不同的人生里<span>会有什么答案？</span></h1>
<form id="ask"><input id="topic" aria-label="你想探索的议题" maxlength="240" placeholder="输入你想探索的问题…" required><button>探索不同视角 <b>↗</b></button></form></section>
<section id="heading" hidden><small>正在探索的议题</small><h2></h2></section>
<section id="choice" hidden><small>已选视角</small><h2></h2><p></p><button id="enter">进入这个视角 →</button></section>
<p id="status" role="status"></p>
<section id="detail" hidden><button id="back">← 返回球体</button><small id="context"></small><h1></h1><p id="story"></p><blockquote></blockquote><a id="source" target="_blank" rel="noopener noreferrer"></a>
<form id="simulate"><label for="condition">如果换一个条件……</label><div><input id="condition" maxlength="240" placeholder="输入你想改变的条件" required><button>推演 →</button></div></form><p id="out" role="status"></p></section>
</main><footer><span class="dot"></span><span id="foot">等待输入议题</span><span class="right">Herdthink / 观点探索</span></footer>
<script type="module" src="./app.js"></script></body></html>
